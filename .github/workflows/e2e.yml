name: E2E Tests

on:
  schedule:
    - cron: '0 8 * * *' # nightly, 08:00 UTC (overnight US)
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test against
        required: true
        type: choice
        options:
          - dev
        default: dev
  # Called by app-deploy.yml after every deploy so the suite always runs
  # against the code it just shipped (and the same commit's test code).
  workflow_call:
    inputs:
      environment:
        description: Environment to test against
        required: false
        type: string
        default: dev

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      # Actions are SHA-pinned: this job mints an OIDC token, assumes the AWS
      # deployment role, and holds Clerk/Stripe secrets, so a repointed
      # mutable tag must not be able to run unreviewed code here.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Dynamo access for the test-state reset (fixed dev test users only).
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          mask-aws-account-id: true
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE }}
          role-session-name: gha-e2e-${{ github.run_id }}
          aws-region: us-east-2

      - name: Run Playwright tests
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dev.stockmountain.io' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
