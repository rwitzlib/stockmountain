name: E2E Tests

# Nightly + on-demand browser suite against the deployed dev environment
# (plan 16 phase 5). Deliberately not PR-blocking.
on:
  schedule:
    - cron: '0 8 * * *' # nightly, 08:00 UTC (overnight US)
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test against
        required: true
        type: choice
        options:
          - dev
        default: dev

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Dynamo access for the test-state reset (fixed dev test users only).
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          mask-aws-account-id: true
          role-duration-seconds: 3600
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE }}
          role-session-name: gha-e2e-${{ github.run_id }}
          aws-region: us-east-2

      - name: Run Playwright tests
        run: npx playwright test
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dev.stockmountain.io' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          # Fixed test-user emails live in source (tests/e2e/src/env.ts); ids
          # are resolved from Clerk at startup, and Stripe price ids from
          # product tier metadata.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
