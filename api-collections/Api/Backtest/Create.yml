info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: https://{{base_url}}{{port}}/api/backtest
  body:
    type: json
    data: |-
      {
        "start": "2026-08-01",
        "end": "2026-08-13",
        "positionSettings": {
          "startingBalance": 300000,
          "maxConcurrentPositions": 1000,
          "model": {
            "type": "Fixed",
            "size": 5000
          },
          "cooldown": {
            "multiplier": 15,
            "timespan": "minute"
          }
        },
        "entrySettings": {
          "filters": [
            "crosses_over(ema(50), ema(200)) [1d]",
            "macd(12,26,9,ema) > 0 [1d]",
            "float > 30000000",
            "time < 10:00"
          ]
        },
        "exitSettings": {
          "stopLoss": {
            "type": "percent",
            "value": 7.5
          },
          "takeProfit": {
            "type": "percent",
            "value": 15
          },
          "timedExit": {
            "avoidOvernight": false,
            "timeframe": {
              "multiplier": 14,
              "timespan": "day"
            }
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("backtest_id", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
