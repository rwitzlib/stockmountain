info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: https://{{base_url}}{{port}}/api/backtest
  body:
    type: json
    data: |-
      {
        "start": "2026-08-01",
        "end": "2026-08-31",
        "positionSettings": {
          "startingBalance": 300000,
          "maxConcurrentPositions": 1000,
          "model": {
            "type": "Fixed",
            "size": 5000
          },
          "cooldown": {
            "multiplier": 15,
            "timespan": "minute"
          }
        },
        "entrySettings": {
          "filters": [
            "adv() > 3 [1d]",
            "macd(12,26,9,ema) > 0 [1m]",
            "close > 2.00 [1m]",
            "float < 20000000"
          ]
        },
        "exitSettings": {
          "stopLoss": {
            "type": "percent",
            "value": 2
          },
          "takeProfit": {
            "type": "percent",
            "value": 5
          },
          "timedExit": {
            "avoidOvernight": true,
            "timeframe": {
              "multiplier": 5,
              "timespan": "minute"
            }
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("backtest_id", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
