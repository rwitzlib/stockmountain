info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: https://{{base_url}}{{port}}/api/backtest
  body:
    type: json
    data: |-
      {
        "start": "2024-01-01",
        "end": "2026-08-13",
        "positionSettings": {
          "startingBalance": 10000,
          "maxConcurrentPositions": 1000,
          "model": {
            "type": "Fixed",
            "size": 5000
          },
          "cooldown": {
            "multiplier": 15,
            "timespan": "minute"
          }
        },
        "entrySettings": {
          "filters": [
            "rsi(14,30,70,ema) < 30 [1m]",
            "float < 50000000",
            "close > 2.50 [1m]",
            "volume > 50000 [1m,5]",
            "volume > 1000000 [1d]",
            "close > sma(200) [1d]",
            "time < 14:00"
          ]
        },
        "exitSettings": {
          "stopLoss": {
            "type": "percent",
            "value": 2
          },
          "takeProfit": {
            "type": "percent",
            "value": 10
          },
          "timedExit": {
            "avoidOvernight": true,
            "timeframe": {
              "multiplier": 5,
              "timespan": "minute"
            }
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("backtest_id", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
