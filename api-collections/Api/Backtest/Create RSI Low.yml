info:
  name: Create RSI Low
  type: http
  seq: 2

http:
  method: POST
  url: https://{{base_url}}{{port}}/api/backtest
  body:
    type: json
    data: |-
      {
        "start": "2024-08-01",
        "end": "2026-08-06",
        "positionSettings": {
          "startingBalance": 100000,
          "maxConcurrentPositions": 1000,
          "model": {
            "type": "Fixed",
            "size": 10000
          },
          "cooldown": {
            "multiplier": 15,
            "timespan": "minute"
          }
        },
        "entrySettings": {
          "filters": [
            "rsi(14,30,70,ema) < 30 [1m]",
            "float < 10000000",
            "close > 1.00 [1m]",
            "volume > 10000 [1m,5]"
          ]
        },
        "exitSettings": {
          "stopLoss": {
            "type": "percent",
            "value": 2
          },
          "takeProfit": {
            "type": "percent",
            "value": 15
          },
          "timedExit": {
            "avoidOvernight": true,
            "timeframe": {
              "multiplier": 5,
              "timespan": "minute"
            }
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("backtest_id", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
