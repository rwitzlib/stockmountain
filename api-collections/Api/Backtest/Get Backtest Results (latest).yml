docs: |
  Returns the capital-constrained portfolio outcome for a completed backtest:
  hold/high/other strategy portfolios with stats, equity curve, and taken trades.
  Does not include the unconstrained trade universe (see universe endpoint stub).
  New trades include dollar-denominated maximum favorable and adverse excursion;
  older persisted results may omit these fields.

  Sample trade:
  ```json
  {
    "ticker": "AAPL",
    "profit": 42.10,
    "maxRunup": 61.20,
    "maxDrawdown": -18.75
  }
  ```

  Each equity point carries per-day signal counts (zero on older results):
  signalsSeen = tradesTaken + skippedFunds + skippedConcurrency. Policy skips
  (duplicate ticker, cooldown) are excluded from signalsSeen.

  Sample equity point:
  ```json
  {
    "date": "2026-06-30T00:00:00-04:00",
    "tradesTaken": 10,
    "signalsSeen": 141,
    "skippedFunds": 96,
    "skippedConcurrency": 35
  }
  ```
