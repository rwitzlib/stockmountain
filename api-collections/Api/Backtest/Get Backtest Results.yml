docs: |
  Returns the persisted backtest portfolios. Each new trade includes dollar-denominated
  maximum favorable and adverse excursion; older results may omit these fields.

  Sample trade:
  ```json
  {
    "ticker": "AAPL",
    "profit": 42.10,
    "maxRunup": 61.20,
    "maxDrawdown": -18.75
  }
  ```

  Each equity point carries per-day signal counts (zero on older results):
  signalsSeen = tradesTaken + skippedFunds + skippedConcurrency. Policy skips
  (duplicate ticker, cooldown) are excluded from signalsSeen.

  Sample equity point:
  ```json
  {
    "date": "2026-06-30T00:00:00-04:00",
    "tradesTaken": 10,
    "signalsSeen": 141,
    "skippedFunds": 96,
    "skippedConcurrency": 35
  }
  ```
